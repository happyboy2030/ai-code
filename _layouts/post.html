---
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%Y 年 %m 月 %d 日" }}
      {% if page.categories %}
        · {{ page.categories | join: " / " }}
      {% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
